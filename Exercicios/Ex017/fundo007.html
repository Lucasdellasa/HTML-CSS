<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>

        #conteiner {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;

            height: 500px;
            background-color: purple;
            padding: 10px;
            position: relative; /*informação meramente simbolica no codigo, apenas para deixar explicito o que está acontecendo, porque, como já informado, a position: relative já é o padrão para caixas e fica oculta no codigo.*/
        }

        #conteudo{
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;

            height: 200px;
            width: 400px;
            margin: auto;
            background-color: yellow;
            
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }
    </style>

</head>
<body>
    
    <section id="conteiner">
        <article id="conteudo">


        </article>

    </section>



</body>
</html>
