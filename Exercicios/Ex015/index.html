<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: green;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: brown;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active{
            color: green;
        }

        a::after{
            content: ' \1F517';
            text-decoration: none;
            font-weight: normal;
            color: rgb(105, 105, 105);
        }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://www.instagram.com/dellasaviasistemas/">Pagina Instagram</a></li>
        <li><a href="https://www.youtube.com/@DellaSaviaSistemas/videos">Canal do YouTube</a></li>
        <li><a href="https://dellasavia.com.br">Site Della Savia</a></li>
    </ul>
</body>
</html>
