<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: Sigilos;
            src: url('SigilosDeConhecimento.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            
        /*Tipos de format()
        - opentype (otf)
        - truetype (ttf)
        - embedded-opentype
        - truetype-aat (apple advanced typography)
        - svg   
        Se eu tiver mais de um tipo, posso simplesmente complementar o codigo. 
        Ex: 
        font-family: SigilosDeConhecimento;
        src: url('SigilosDeConhecimento.ttf') format ('truetype'), url('SigilosDeConhecimento.otf') format ('opentype');   
        Cada navegador vai ser compativel com um tipo ou outro... Só devemos nos atendar bastante ao nome exato que deve estar discriminado no codigo, identico ao do arquivo original da font*/
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        
        h1{
            font-family: 'Sigilos', Arial, Helvetica, sans-serif;
            font-size: 3em;
            text-align: center;
        }


    </style>



</head>




<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio exercitationem pariatur iste libero, soluta delectus aliquid ea quod quo recusandae neque, repudiandae necessitatibus voluptatem odio rerum nihil voluptatum. Tenetur, atque.</p>


</body>
</html>
