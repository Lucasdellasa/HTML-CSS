<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            height: 300px;
            width: 300px;
            background-color: lightblue;
            /*border-width: 10px;
            border-style: solid;
            border-color: lightcoral;*/

            border: 10px solid lightcoral;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            margin:auto;
            /*margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;*/

            outline-width: 5px;
            outline-style: dashed;
            outline-color: slateblue;
        }
    </style>


</head>

<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Além do proprio h1, paragrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level.</a> Vamos ver como tudo isso funciona?</p>    
</body>
</html>
