<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 011</title>

<style>

    table{
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
    }

    thead{
        color: white;
        background-color: gray;
        font-weight: bolder;
    }

    th{
        border: 2px solid black;
        padding: 10px;
        text-align: center;
    }

    td{

        padding: 10px;
        text-align: center;
    }

        padding: 10px;

        font-weight: bolder;
    }

    .valortotais{

        padding: 10px;

        font-weight: bolder;
    }

    .area{

    }

</style>
</head>
